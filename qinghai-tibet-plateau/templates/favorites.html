{% extends "base.html" %}
{% block title %}我的收藏 - 青藏高原生态保护科普资源数据管理系统{% endblock %}
{% block content %}
<h4 class="mb-3">我的收藏</h4>

<div class="card shadow-sm">
  <table class="table table-hover align-middle mb-0">
    <thead class="table-light">
      <tr><th>标题</th><th>来源</th><th>专题</th><th>收藏时间</th><th class="text-end">操作</th></tr>
    </thead>
    <tbody>
      {% for a in articles %}
      <tr>
        <td><a href="{{ url_for('article.detail', article_id=a.article_id) }}"
               class="text-decoration-none">{{ a.title }}</a></td>
        <td>{{ a.source_name or '—' }}</td>
        <td>{{ a.topic_name or '—' }}</td>
        <td class="small text-muted">{{ a.favorite_time }}</td>
        <td class="text-end">
          <form method="post" action="{{ url_for('auth.toggle_favorite', article_id=a.article_id) }}"
                class="d-inline">
            <button class="btn btn-sm btn-outline-danger">取消收藏</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="5" class="text-center text-muted py-4">还没有收藏任何文章</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
